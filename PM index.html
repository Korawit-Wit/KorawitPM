<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PM SA8 Planner</title>
<meta name="theme-color" content="#1b232b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app bar + tab bar (bottom on phones), one working panel per tab. Tokens first, components after. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f5f7f9; --ink:#17202a; --muted:#5a6672; --line:#d3dae1; --soft:#e6ebef;
  --accent:#d1481a; --accent-ink:#ffffff; --accent-soft:#fbe6dd; --link:#0b5cad;
  --heater:#17202a; --meth:#8a6a00; --tus:#1f5fa8; --sat:#5a6672;
  --ok:#1d7a4a; --ok-soft:#dcf1e5; --warn:#8a5a00; --warn-soft:#fdeccd; --bad:#b3261e; --bad-soft:#fbe0de; --post:#6a3fb0; --post-soft:#e9e0f7;
  --weekend:#e7ecef; --today:#fff3d6; --bar:#1b232b; --bar-ink:#eef2f5;
  --sans:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2128; --surface2:#20282f; --ink:#e8edf1; --muted:#9ba7b2; --line:#2e3943; --soft:#27313a;
  --accent:#ff8a5c; --accent-ink:#1b0f08; --accent-soft:#3a2118; --link:#6cb2f5;
  --heater:#e8edf1; --meth:#e0b43a; --tus:#6fb0f2; --sat:#9ba7b2;
  --ok:#5fd18f; --ok-soft:#173526; --warn:#f0b35a; --warn-soft:#3b2b10; --bad:#ff8f86; --bad-soft:#3d1c1a; --post:#b697f0; --post-soft:#2c2243;
  --weekend:#222b32; --today:#3a3216; --bar:#0c1014; --bar-ink:#e8edf1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2128; --surface2:#20282f; --ink:#e8edf1; --muted:#9ba7b2; --line:#2e3943; --soft:#27313a;
  --accent:#ff8a5c; --accent-ink:#1b0f08; --accent-soft:#3a2118; --link:#6cb2f5;
  --heater:#e8edf1; --meth:#e0b43a; --tus:#6fb0f2; --sat:#9ba7b2;
  --ok:#5fd18f; --ok-soft:#173526; --warn:#f0b35a; --warn-soft:#3b2b10; --bad:#ff8f86; --bad-soft:#3d1c1a; --post:#b697f0; --post-soft:#2c2243;
  --weekend:#222b32; --today:#3a3216; --bar:#0c1014; --bar-ink:#e8edf1; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.bar{background:var(--bar);color:var(--bar-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bar .in{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.brand{font-weight:600;font-size:17px;letter-spacing:.01em}
.brand small{font:400 12px var(--mono);opacity:.7;margin-left:8px}
.pill{display:inline-flex;gap:6px;align-items:center;font:500 12px var(--mono);padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);max-width:100%}
.pill.ok{color:#7fe0a8;border-color:#2e7d52}.pill.bad{color:#ffb4ab;border-color:#9b3a33}.pill.loc{color:#ffd28a;border-color:#8a6a24}
.pill button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav.tabs .in{max-width:1180px;margin:auto;display:flex;overflow-x:auto;padding:0 8px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1180px;margin:auto;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
@media(max-width:640px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs .in{justify-content:space-between;padding:0}
  nav.tabs button{flex:1;padding:10px 4px;font-size:12px;border-bottom:0;border-top:3px solid transparent}
  nav.tabs button[aria-selected=true]{border-top-color:var(--accent)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 14px;min-height:36px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:2px 10px;font-size:13px}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[aria-busy=true]{opacity:.6;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;min-width:0}
input[type=text],input[type=password],input[type=date],input[type=url],select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:36px;width:100%;min-width:0;font-size:14px;text-transform:none;letter-spacing:0;font-family:var(--sans)}
textarea{min-height:200px;line-height:1.5;resize:vertical;font-family:var(--sans)}
input.mono{font-family:var(--mono);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:12px;min-height:18px}
.hint.bad{color:var(--bad)}.hint.ok{color:var(--ok)}
.banner{border-radius:6px;padding:10px 12px;border:1px solid;font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.ok{background:var(--ok-soft);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 12px;font-size:13px}
.chip b{font-family:var(--mono);font-size:15px;margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin:10px 0}
.sym{font-family:var(--mono);font-weight:600}
.s-HEATER{color:var(--heater)}.s-METHANOL{color:var(--meth)}.s-TUS{color:var(--tus)}.s-SAT{color:var(--sat)}
.pm{font:600 10px var(--mono);background:var(--accent);color:var(--accent-ink);padding:0 4px;border-radius:2px}
.scroll{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:960px;width:100%}
table.mx th,table.mx td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0;min-width:30px;height:40px}
table.mx thead th{background:var(--surface2);font:500 11px var(--mono);border-top:1px solid var(--line);height:auto;padding:3px 0}
table.mx thead th small{display:block;color:var(--muted);font-size:9px}
table.mx .fh{position:sticky;left:0;z-index:2;background:var(--surface2);font-weight:600;min-width:46px;border-left:1px solid var(--line)}
table.mx .we{background:var(--weekend)}
table.mx .today{background:var(--today);box-shadow:inset 0 0 0 2px var(--accent)}
table.mx td.cell{cursor:pointer}
table.mx td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.mx td.sel{outline:2px solid var(--ink);outline-offset:-2px}
.mk{display:inline-block;margin:0 1px;line-height:1.2}
.mk.done{opacity:.35;text-decoration:line-through}.mk.doing{outline:1px solid var(--warn);border-radius:3px}
.mk.post{outline:1px dashed var(--post);border-radius:3px}.mk.canc{opacity:.3;text-decoration:line-through}
.pillst{font:500 11px var(--mono);padding:1px 8px;border-radius:999px;white-space:nowrap}
.st-รอดำเนินการ{background:var(--soft);color:var(--muted)}.st-กำลังทำ{background:var(--warn-soft);color:var(--warn)}
.st-เสร็จแล้ว{background:var(--ok-soft);color:var(--ok)}.st-เลื่อน{background:var(--post-soft);color:var(--post)}.st-ยกเลิก{background:var(--soft);color:var(--muted);text-decoration:line-through}
.task{display:grid;grid-template-columns:150px 74px minmax(0,1.2fr) 140px minmax(0,1.5fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.task.today{background:var(--today)}.task.pend{opacity:.55}
@media(max-width:900px){.task{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}.task .wide{grid-column:1/-1}}
.dayhead{font:600 13px var(--mono);color:var(--muted);padding:12px 0 4px;display:flex;gap:8px;align-items:center}
.dayhead .tag{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 6px;font-size:11px}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.t th{text-align:left;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dest{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.ent{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.ent .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
@media(max-width:640px){.ent .cols{grid-template-columns:minmax(0,1fr)}}
label.f .badge{align-self:flex-start;text-transform:none}
.badge{font:500 11px var(--mono);padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.bad{color:var(--bad);border-color:var(--bad)}
code{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
ol.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:460px;margin:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:14px;z-index:50}
.toast.bad{background:var(--bad);color:#fff}
@media(min-width:641px){.toast{bottom:24px}}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><main>ต้องเปิดใช้งาน JavaScript</main></noscript>
<script>
(function () {
'use strict';
var LEGEND = {
  HEATER: { sym: '●', job: 'ตรวจเช็คหัวเผา ±2 วัน' },
  METHANOL: { sym: '▲', job: 'ทำความสะอาดท่อเมทานอล ±2 วัน' },
  TUS: { sym: '☆', job: 'ตรวจเช็ค TUS ±2 วัน' },
  SAT: { sym: '□', job: 'ตรวจเช็ค SAT ±2 วัน' },
  PM: { sym: 'PM', job: 'ทำความสะอาดเตา + PM (pm/sooting)' }
};
var CODE_KEYS = ['HEATER', 'METHANOL', 'TUS', 'SAT', 'PM'];
var STATUSES = ['รอดำเนินการ', 'กำลังทำ', 'เสร็จแล้ว', 'เลื่อน', 'ยกเลิก'];
var DOW_TH = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function isIso(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
  if (!m) return false;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
}
function fmtDate(iso) {
  var p = iso.split('-'), y = +p[0], m = +p[1], d = +p[2];
  return DOW_TH[new Date(Date.UTC(y, m - 1, d)).getUTCDay()] + ' ' + pad2(d) + '/' + pad2(m) + '/' + y;
}
function fmtDMY(iso) { var p = iso.split('-'); return pad2(+p[2]) + '/' + pad2(+p[1]) + '/' + p[0]; }
function fmtShort(iso) { var p = iso.split('-'); return pad2(+p[2]) + '/' + pad2(+p[1]); }
function addDays(iso, n) {
  var p = iso.split('-'), t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
  return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate());
}
function fnum(f) { return parseInt(String(f).replace(/\D/g, ''), 10) || 0; }
function cmpTask(a, b) {
  if (a.d !== b.d) return a.d < b.d ? -1 : 1;
  return (fnum(a.f) - fnum(b.f)) || (CODE_KEYS.indexOf(a.code) - CODE_KEYS.indexOf(b.code));
}
function isOpen(t) { return t.st === 'รอดำเนินการ' || t.st === 'กำลังทำ'; }
function dayList(tasks, iso) { return tasks.filter(function (t) { return t.d === iso && t.st !== 'ยกเลิก'; }).sort(cmpTask); }
function overdueList(tasks, iso) { return tasks.filter(function (t) { return t.d < iso && isOpen(t); }).sort(cmpTask); }
function itemLine(t, showSt) {
  var s = 'F' + fnum(t.f) + ' ' + LEGEND[t.code].sym + ' ' + LEGEND[t.code].job;
  if (t.rem) s += '\n   ↳ ' + t.rem;
  if (showSt) s += '\n   สถานะ: ' + t.st;
  return s;
}
function dayBlock(title, iso, list, showSt) {
  var h = title + '\n📅 ' + fmtDate(iso) + (list.length ? '  (' + list.length + ' งาน)' : '');
  if (!list.length) return h + '\n– ไม่มีงานตามแผน –';
  return h + '\n\n' + list.map(function (t) { return itemLine(t, showSt); }).join('\n');
}
function overdueBlock(tasks, iso) {
  var od = overdueList(tasks, iso);
  if (!od.length) return '';
  var lines = od.slice(0, 10).map(function (t) {
    return '• ' + fmtShort(t.d) + ' F' + fnum(t.f) + ' ' + LEGEND[t.code].sym + ' ' + LEGEND[t.code].job + ' [' + t.st + ']';
  });
  if (od.length > 10) lines.push('…และอีก ' + (od.length - 10) + ' รายการ');
  return '⚠️ ค้างจากวันก่อน (' + od.length + ')\n' + lines.join('\n');
}
function composeMorning(tasks, iso) {
  var t = dayBlock('🔔 แผน PM SA8 – รอบเช้า', iso, dayList(tasks, iso), true);
  var od = overdueBlock(tasks, iso);
  return od ? t + '\n\n' + od : t;
}
function composeEvening(tasks, iso) {
  var td = dayList(tasks, iso), open = td.filter(isOpen), tm = addDays(iso, 1);
  var t = dayBlock('🔔 แผน PM SA8 – รอบเย็น (วันนี้)', iso, td, true);
  if (td.length) t += '\n\nคงเหลือยังไม่เสร็จ: ' + open.length + '/' + td.length;
  t += '\n\n' + dayBlock('➡️ งานพรุ่งนี้', tm, dayList(tasks, tm), false);
  var od = overdueBlock(tasks, iso);
  return od ? t + '\n\n' + od : t;
}
function composeTomorrow(tasks, iso) {
  var tm = addDays(iso, 1);
  return dayBlock('➡️ แผน PM SA8 – พรุ่งนี้', tm, dayList(tasks, tm), false);
}
function composeOverdue(tasks, iso) {
  return overdueBlock(tasks, iso) || '✅ ไม่มีงานค้างจากวันก่อน';
}
function isEmptyMorning(tasks, iso) { return !dayList(tasks, iso).length && !overdueList(tasks, iso).length; }
function isEmptyEvening(tasks, iso) { return isEmptyMorning(tasks, iso) && !dayList(tasks, addDays(iso, 1)).length; }


// ============ ค่าคงที่ / ตัวช่วย ============
var ID_RE = /^[CRU][0-9a-f]{32}$/;
var FURN = ['F1', 'F2', 'F3', 'F5', 'F6', 'F7', 'F8', 'F9'];
var MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
var LS_CONN = 'pmapp.conn.v1', LS_LOCAL = 'pmapp.local.v1', LS_CACHE = 'pmapp.cache.v1', SS_KEY = 'pmapp.key';
var $app = document.getElementById('app'), $toast = document.getElementById('toast');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function nowTime() { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date()); }
function todayBkk() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date()); }
function dowOf(iso) { return new Date(iso + 'T00:00:00Z').getUTCDay(); }
function daysIn(m) { var p = m.split('-'); return new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate(); }
function monthLabel(m) { var p = m.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
function shiftMonth(m, n) { var p = m.split('-'), t = new Date(Date.UTC(+p[0], +p[1] - 1 + n, 1)); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1); }
function rid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
var mem = {};
function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return mem[k] || null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { mem[k] = v; S.storageWarn = true; return false; } }
function defaultCfg() {
  return { g1: { name: 'กลุ่ม 1', id: '', auto: true, manual: true, cmd: false }, g2: { name: 'กลุ่ม 2', id: '', auto: true, manual: true, cmd: false }, users: [], notifyStatus: false, skipEmpty: true };
}
function newDataset() { return { tasks: [], log: [], sends: [], cfg: defaultCfg(), seen: [], tokens: { t1: {}, t2: {} }, triggers: [], rev: 0, nid: 1 }; }

// ============ แผนตัวอย่าง (ตุลาคม 2026 ตามภาพแผน) ============

function mkErr(msg, kind, data) { var e = new Error(msg); e.userMsg = msg; e.kind = kind; e.data = data; return e; }
function api(action, payload, opts) {
  if (!S.url) return Promise.reject(mkErr('ยังไม่ได้ตั้งลิงก์ Web App', 'config'));
  if (!S.key) return Promise.reject(mkErr('ยังไม่ได้ใส่รหัสลับ (MANUAL_KEY)', 'config'));
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, (opts && opts.timeout) || 45000);
  var body = Object.assign({ key: S.key, action: action }, payload || {});
  return fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined, redirect: 'follow' })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      clearTimeout(timer);
      var j;
      try { j = JSON.parse(t); } catch (e) {
        throw mkErr(/^\s*</.test(t) ? 'ลิงก์นี้ไม่ใช่ Web App ที่ใช้งานได้ ตรวจว่าเป็นลิงก์ที่ลงท้าย /exec, Deploy แล้ว และตั้ง Who has access เป็น Anyone' : 'ตอบกลับไม่ถูกต้อง', 'format');
      }
      if (!j.ok) throw mkErr(j.error || 'เกิดข้อผิดพลาด', 'server', j);
      return j;
    })
    .catch(function (e) {
      clearTimeout(timer);
      if (e && e.kind) throw e;
      if (e && e.name === 'AbortError') throw mkErr('หมดเวลารอการตอบกลับ (45 วินาที)', 'timeout');
      throw mkErr('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตและลิงก์ Web App', 'network');
    });
}
function toast(m, bad) {

function validTaskFields(f, partial) {
  if ((!partial || f.d !== undefined) && !isIso(f.d)) return 'วันที่ไม่ถูกต้อง';
  if ((!partial || f.f !== undefined) && !/^F\d{1,2}$/.test(String(f.f))) return 'หมายเลขเตาไม่ถูกต้อง (เช่น F5)';
  if ((!partial || f.code !== undefined) && !LEGEND[f.code]) return 'ประเภทงานไม่ถูกต้อง';
  if ((!partial || f.st !== undefined) && STATUSES.indexOf(f.st) < 0) return 'สถานะไม่ถูกต้อง';
  if (f.rem !== undefined && String(f.rem).length > 300) return 'หมายเหตุยาวเกิน 300 ตัวอักษร';
  return '';
}
function findTask(ds, id) { for (var i = 0; i < ds.tasks.length; i++) if (ds.tasks[i].id === id) return ds.tasks[i]; return null; }
function addLocalLog(ds, what, f, d, o, n) { ds.log.unshift({ t: new Date().toLocaleString('en-GB', { timeZone: 'Asia/Bangkok', hour12: false }).replace(',', ''), who: S.user, sheet: 'Plan', what: what, f: f, d: d ? fmtDMY(d) : '', o: o, n: n, src: 'แอป' }); if (ds.log.length > 500) ds.log.length = 500; }
var FIELD_LABEL = { d: 'วันที่', f: 'เตา', code: 'ประเภทงาน', rem: 'หมายเหตุ', st: 'สถานะ' };
function applyOp(ds, op, local) {
  if (op.op === 'add') {
    var t = { id: local ? 'L' + (ds.nid++) : op.tmp, d: op.task.d, f: op.task.f, code: op.task.code, rem: op.task.rem || '', st: op.task.st || 'รอดำเนินการ', upd: '', by: S.user, pending: !local };
    ds.tasks.push(t);
    if (local) addLocalLog(ds, 'เพิ่มงาน', t.f, t.d, '', LEGEND[t.code].sym + ' ' + t.code + (t.rem ? ' – ' + t.rem : ''));
  } else if (op.op === 'set') {
    var x = findTask(ds, op.id); if (!x) return;
    Object.keys(op.fields).forEach(function (k) {
      if (x[k] === op.fields[k]) return;
      if (local) addLocalLog(ds, FIELD_LABEL[k], k === 'f' ? op.fields.f : x.f, k === 'd' ? op.fields.d : x.d, k === 'd' ? fmtDMY(x[k]) : x[k], k === 'd' ? fmtDMY(op.fields[k]) : op.fields[k]);
      x[k] = op.fields[k];
    });
    if (local) x.by = S.user;
  } else if (op.op === 'del') {
    var y = findTask(ds, op.id); if (!y) return;
    if (local) addLocalLog(ds, 'ลบงาน', y.f, y.d, y.code + ' ' + y.rem, 'ลบแล้ว');
    ds.tasks = ds.tasks.filter(function (z) { return z.id !== op.id; });
  }
}
function mutate(op) {

  if (op.op === 'add') op.tmp = 'tmp' + (S.tmpN++);
  applyOp(S.R, op, false); S.queue.push(op); render(); pump();
}
function pump() {
  if (S.pumping || !S.queue.length) return;
  S.pumping = true;
  var batch = S.queue.splice(0, S.queue.length);
  api('ops', { ops: batch, user: S.user }).then(function (r) {
    S.online = true; applyState(r);
    (r.results || []).forEach(function (x) { if (!x.ok) toast('บันทึกไม่สำเร็จ: ' + x.error, true); });
    S.queue.forEach(function (op) { applyOp(S.R, op, false); });
  }).catch(function (e) {
    if (e.kind === 'network' || e.kind === 'timeout') { S.online = false; S.err = e.userMsg; }
    toast('บันทึกไม่สำเร็จ: ' + e.userMsg + ' (แสดงข้อมูลล่าสุดจากชีตแทน)', true);
    return api('state').then(function (r) { applyState(r); S.online = true; }).catch(function () { /* คงข้อมูลเดิม */ });
  }).then(function () { S.pumping = false; render(); pump(); });
}

  if (r.tokens) R.tokens = r.tokens; if (r.triggers) R.triggers = r.triggers; if (r.rev) R.rev = r.rev; if (r.today) S.today = r.today;

// ---------- แท็บ: ส่ง LINE ----------
function entries(cfg) {
  var l = [];
  [['g1', cfg.g1], ['g2', cfg.g2]].forEach(function (p) { if (p[1].id) l.push({ id: p[1].id, name: p[1].name || p[0], kind: 'กลุ่ม', manual: p[1].manual }); });
  cfg.users.forEach(function (u) { if (u.id) l.push({ id: u.id, name: u.name, kind: 'ผู้ใช้', manual: u.manual }); });
  return l;
}
function composeFor(s) {
  var tasks = S.d.tasks, d = s.date || S.today;
  if (s.preset === 'today') return composeMorning(tasks, d);
  if (s.preset === 'tomorrow') return composeTomorrow(tasks, d);
  if (s.preset === 'evening') return composeEvening(tasks, d);
  if (s.preset === 'overdue') return composeOverdue(tasks, d);
  return s.text;
}
function renderSend() {
  var s = S.send, es = entries(S.d.cfg);

  var h = '<div class="stack">';
  if (S.mode !== 'remote') h += '<div class="banner warn">ต้องเชื่อมต่อ Google Sheet ก่อนจึงจะส่ง LINE จริงได้ ดูตัวอย่างข้อความได้ตามปกติ</div>';
  h += '<div class="grid2"><div class="card"><h2>1) เลือกข้อความ</h2><div class="seg" role="group" aria-label="รูปแบบข้อความ">' +
    [['today', 'แผนวันนี้'], ['tomorrow', 'แผนพรุ่งนี้'], ['evening', 'สรุปรอบเย็น'], ['overdue', 'งานค้าง'], ['custom', 'พิมพ์เอง']].map(function (p) { return '<button data-act="preset" data-v="' + p[0] + '" aria-pressed="' + (s.preset === p[0]) + '" type="button">' + p[1] + '</button>'; }).join('') + '</div>' +

    '<label class="f">ข้อความที่จะส่ง (แก้ไขได้)<textarea id="stext" data-act="stext" maxlength="20000">' + esc(s.text) + '</textarea></label><div class="muted small mono" id="scount">' + s.text.length + ' ตัวอักษร</div></div>' +
    '<div class="card"><h2>2) เลือกปลายทาง</h2>';
  if (!es.length) h += '<div class="empty">ยังไม่ได้ใส่ Group ID หรือ User ID<br><button class="btn" data-act="tab" data-v="settings" type="button" style="margin-top:10px">ไปตั้งค่าปลายทาง</button></div>';
  else h += '<div class="stack" style="gap:8px">' + es.map(function (e) { return '<label class="dest"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--accent)" data-act="dsel" data-id="' + esc(e.id) + '"' + (s.sel[e.id] ? ' checked' : '') + '><span class="grow"><b>' + esc(e.name) + '</b> <span class="badge">' + e.kind + '</span><br><span class="mono muted small">' + esc(e.id.slice(0, 7)) + '…' + esc(e.id.slice(-4)) + '</span></span></label>'; }).join('') + '</div>';
  h += '<div style="margin-top:14px">';

  if (s.confirm) h += '<div class="banner warn" style="margin-bottom:10px">ยืนยันส่ง <b>' + nsel + ' ปลายทาง</b> ข้อความ ' + s.text.length + ' ตัวอักษร?</div><div class="row"><button class="btn pri" data-act="send" type="button">ยืนยันส่ง</button><button class="btn" data-act="sendcancel" type="button">ยกเลิก</button></div>';

  return h + '</div>';
}
function selectedIds() { var s = S.send; return entries(S.d.cfg).filter(function (e) { return s.sel && s.sel[e.id]; }).map(function (e) { return e.id; }); }
function doSend() {
  var s = S.send, ids = selectedIds();
  if (s.busy) return;
  if (S.mode !== 'remote') { s.err = 'ต้องเชื่อมต่อ Google Sheet ก่อน (แท็บ ตั้งค่า)'; render(); return; }
  if (!ids.length) { s.err = 'เลือกปลายทางอย่างน้อย 1 รายการ'; render(); return; }
  if (!s.text.trim()) { s.err = 'ไม่มีข้อความที่จะส่ง'; render(); return; }
  if (!s.confirm) { s.confirm = true; s.err = ''; render(); return; }
  s.confirm = false; s.busy = true; s.err = ''; s.results = null;
  if (!s.rid) s.rid = rid();
  render();
  api('send', { text: s.text, dests: ids, rid: s.rid, src: 'แมนนวล', user: S.user }, { timeout: 60000 }).then(function (r) {
    s.busy = false; s.results = r.results; s.dup = !!r.dup; s.rid = ''; s.retry = false; S.online = true;
    toast('ส่งสำเร็จ ' + r.okCount + '/' + r.total + ' ปลายทาง', r.okCount === 0);
    render(); refresh();
  }).catch(function (e) {
    s.busy = false;
    var unknown = e.kind === 'timeout' || e.kind === 'network' || e.kind === 'format';
    s.retry = unknown; if (!unknown) s.rid = '';
    s.err = e.userMsg + (unknown ? ' — ยังไม่ทราบว่าข้อความถูกส่งแล้วหรือไม่ ตรวจใน LINE ได้ ถ้ากดส่งซ้ำ ระบบจะไม่ส่งข้อความเดิมซ้ำให้' : '');
    render();
  });
}

    }
    case 'resetq': api('resetQuota').then(function () { toast('รีเซ็ตสถานะโควต้าแล้ว'); }).catch(function (e) { toast(e.userMsg, true); }); break;
    case 'trig': api(v).then(function (r) { S.R.triggers = r.triggers; toast(v === 'installTriggers' ? 'ติดตั้งเวลาอัตโนมัติแล้ว' : 'ลบเวลาอัตโนมัติแล้ว'); render(); }).catch(function (e) { toast(e.userMsg + (/สิทธิ์|authorization|permission/i.test(e.userMsg) ? '' : ''), true); }); break;
    case 'refreshseen': refresh().then(function () { toast('รีเฟรชแล้ว'); }); break;
    case 'useseen': {
      var cf = S.form.cfg;
      if (v === 'user') { if (cf.users.length >= 20) { toast('เพิ่มผู้ใช้ได้ไม่เกิน 20 คน', true); break; } cf.users.push({ name: '', id: id, auto: false, manual: true, cmd: false }); }
      else cf[v].id = id;
      S.formDirty = true; render(); toast('นำ ID ไปใส่แล้ว อย่าลืมกด "บันทึกการตั้งค่าปลายทาง"'); break;
    }
    case 'export': exportData(); break;
    case 'resetlocal': if (el.getAttribute('data-armed')) { S.L = newDataset(); seedTasks(S.L); saveLocal(); render(); toast('คืนค่าเป็นแผนตัวอย่างแล้ว'); } else { el.setAttribute('data-armed', '1'); el.textContent = 'กดอีกครั้งเพื่อยืนยันล้างข้อมูล'; el.classList.add('armed'); } break;
  }
});
$app.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('td.cell')) ev.target.click(); });
$app.addEventListener('change', function (ev) {
  var el = ev.target, act = el.getAttribute('data-act'), k = el.getAttribute('data-k');
  if (act === 'chg') { chgTask(el.getAttribute('data-id'), el.getAttribute('data-fld'), el.value); return; }
  if (act === 'monthsel') { S.month = el.value; S.sel = null; render(); return; }
  if (act === 'fm') { S.filt.m = el.value; render(); return; }
  if (act === 'ff') { S.filt.f = el.value; render(); return; }
  if (act === 'fs') { S.filt.s = el.value; render(); return; }
  if (act === 'fod') { S.filt.od = el.checked; render(); return; }
  if (act === 'dsel') { S.send.sel[el.getAttribute('data-id')] = el.checked; S.send.confirm = false; S.send.rid = ''; S.send.retry = false; render(); return; }
  if (act === 'sdate') { S.send.date = el.value || S.today; if (S.send.preset !== 'custom') S.send.text = composeFor(S.send); S.send.rid = ''; render(); return; }
  if (act === 'import') {
    var f = el.files && el.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var j = JSON.parse(rd.result);
        if (!j || j.app !== 'pm-sa8' || !Array.isArray(j.tasks)) throw new Error('ไฟล์นี้ไม่ใช่ข้อมูลสำรองของแอปนี้');
        var bad = j.tasks.filter(function (t) { return validTaskFields(t, false) || !t.id; }).length;
        if (bad) throw new Error('ข้อมูลในไฟล์ไม่ถูกต้อง ' + bad + ' รายการ');
        S.L.tasks = j.tasks.map(function (t, i) { return { id: 'L' + (i + 1), d: t.d, f: t.f, code: t.code, rem: t.rem || '', st: t.st, upd: '', by: t.by || '' }; }); S.L.nid = S.L.tasks.length + 1;
        S.L.log = Array.isArray(j.log) ? j.log : []; if (j.cfg && j.cfg.g1) S.L.cfg = j.cfg; saveLocal(); S.form = null; render(); toast('นำเข้า ' + S.L.tasks.length + ' งานแล้ว');
      } catch (e) { toast(e.message || 'อ่านไฟล์ไม่ได้', true); }
    };
    rd.readAsText(f); return;
  }
  if (k && /^newTask/.test(k)) { setPath(S, k, el.value); return; }
  if (k && S.form) { setPath(S, 'form.' + k, el.type === 'checkbox' ? el.checked : (el.getAttribute('data-idf') ? el.value.replace(/\s+/g, '') : el.value)); if (/^cfg/.test(k)) S.formDirty = true; if (el.type === 'checkbox') render(); }
});
$app.addEventListener('input', function (ev) {
  var el = ev.target, k = el.getAttribute('data-k'), act = el.getAttribute('data-act');
  if (act === 'fq') { S.filt.q = el.value; clearTimeout(input.h); input.h = setTimeout(function () { render(); }, 250); return; }
  if (act === 'stext') { S.send.text = el.value; S.send.preset = 'custom'; S.send.confirm = false; S.send.rid = ''; S.send.retry = false; var c = document.getElementById('scount'); if (c) c.textContent = el.value.length + ' ตัวอักษร'; document.querySelectorAll('[data-act=preset]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === 'custom' ? 'true' : 'false'); }); return; }
  if (!k) return;
  if (/^newTask/.test(k)) { setPath(S, k, el.value); return; }
  if (!S.form) return;
  var val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.getAttribute('data-idf')) { val = String(val).replace(/\s+/g, ''); }
  setPath(S, 'form.' + k, val);
  if (/^cfg/.test(k)) S.formDirty = true;
  if (el.getAttribute('data-idf')) { var hint = $app.querySelector('[data-hint="' + k + '"]'); if (hint) { var m = idHint(val); hint.textContent = m; hint.className = 'hint ' + (m ? 'bad' : ''); } }
});
function input() {}
document.addEventListener('focusout', function () { if (S.pending) setTimeout(function () { if (!isEditing()) render(); }, 60); });

// ============ เริ่มต้น ============
function boot() {
  var conn = lsGet(LS_CONN) || {};
  S.url = conn.url || ''; S.user = conn.user || 'ผู้ใช้'; S.remember = !!conn.remember;
  try { S.key = conn.remember ? (conn.key || '') : (sessionStorage.getItem(SS_KEY) || ''); } catch (e) { S.key = conn.key || ''; }
  var loc = lsGet(LS_LOCAL);
  if (loc && Array.isArray(loc.tasks)) { S.L.tasks = loc.tasks; S.L.log = loc.log || []; S.L.cfg = loc.cfg && loc.cfg.g1 ? loc.cfg : defaultCfg(); S.L.nid = loc.nid || (loc.tasks.length + 1); }
  else { seedTasks(S.L); saveLocal(); }
  S.mode = S.url ? 'remote' : 'local';
  if (S.mode === 'remote') { var ca = lsGet(LS_CACHE); if (ca && Array.isArray(ca.tasks)) { S.R.tasks = ca.tasks; S.R.log = ca.log || []; S.R.sends = ca.sends || []; S.R.cfg = ca.cfg || defaultCfg(); S.R.rev = ca.rev || 0; S.lastSync = ca.ts || ''; } }
  S.today = todayBkk(); S.d = S.mode === 'remote' ? S.R : S.L; S.tab = S.mode === 'remote' ? 'plan' : 'plan';
  S.month = ''; pickMonth(); render();
  if (S.mode === 'remote' && S.key) connect(true);
  setInterval(poll, 15000);
  setInterval(function () { var t = todayBkk(); if (t !== S.today && S.mode === 'local') { S.today = t; render(); } }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
}
boot();
})();
</script>
